  <path d="M375 256 C500 300, 1300 820, 1410 836" class="p"/>
  <path d="M545 256 C700 320, 1300 900, 1410 902" class="p"/>
  <path d="M720 256 C900 340, 1300 960, 1410 968" class="p"/>
  <!-- dual path from center users to dual path box -->
  <path d="M1360 560 H1410" class="g"/>
  <path d="M1360 600 H1410" class="o"/>
  <!-- to MSSW -->
  <path d="M1545 490 V510" class="g"/>
  <path d="M1840 490 V510" class="o"/>
  <!-- LLM -->
  <path d="M1440 256 C1480 400, 1500 640, 1530 640" class="p"/>
  <!-- storage -->
  <path d="M260 730 V880" class="o dash"/>
  <path d="M690 730 V880" class="o dash"/>
  <path d="M1120 730 V880" class="o dash"/>
</svg>
