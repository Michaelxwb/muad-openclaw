  <path d="M170 256 V340" class="g"/>
  <path d="M170 340 C170 360, 260 380, 260 390" class="g"/>
  <path d="M170 340 C400 360, 690 380, 690 390" class="g"/>
  <path d="M170 340 C700 360, 1120 380, 1120 390" class="g"/>
