[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "muad-skill-http"
version = "0.3.0"
description = "Trace-aware HTTP helpers and platform request client for muad skills"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "muad-openclaw maintainers" }]
keywords = ["http", "requests", "tracing", "skills"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["requests>=2.31,<3"]

[project.urls]
Homepage = "https://github.com/Michaelxwb/muad-openclaw"
Source = "https://github.com/Michaelxwb/muad-openclaw/tree/main/tools/muad-skill-sdk"

[tool.setuptools]
packages = ["muad_skill_http"]

[tool.pytest.ini_options]
testpaths = ["test"]
