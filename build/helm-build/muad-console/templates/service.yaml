apiVersion: v1
kind: Service
metadata:
  name: {{ include "muad-console.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "muad-console.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "muad-console.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePort | default .Values.service.port }}
      {{- end }}
  {{- if eq .Values.service.type "NodePort" }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy | default "Cluster" }}
  {{- end }}
  # 对外暴露请另配 Ingress/LoadBalancer（建议加 TLS + 访问控制）