{{- if .Values.configFile.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: muad-console-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "muad-console.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.yaml: |
    {{- .Values.configFile.content | nindent 4 }}
{{- end }}