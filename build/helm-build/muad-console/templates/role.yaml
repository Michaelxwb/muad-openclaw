# console 以受限 RBAC 在自身 namespace 内建/删/伸缩/exec/取日志 worker（Deployment + PVC + Secret）。
# 与 k8s/console.yaml 中 Role 的权限保持一致；仅在 runtime.driver=k8s 时起作用。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "muad-console.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "muad-console.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]