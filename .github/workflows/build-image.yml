name: build-image

# 推送 git tag（v*）即构建并推送镜像到 GHCR。
# 基础镜像（muad-openclaw-base）若不存在则自动构建并推送；否则直接复用。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      openclaw_version:
        description: 'openclaw 基础镜像版本（ghcr.io/openclaw/openclaw:<tag>）'
        default: '2026.9.8'
      base_tag:
        description: '基础镜像 tag（默认跟随 openclaw_version；禁止 latest，避免跨版本复用旧 base）'
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve base image（检查是否存在）
        id: base
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          BASE_IMAGE="ghcr.io/${OWNER}/muad-openclaw-base"
          OPENCLAW_VERSION="${{ inputs.openclaw_version || '2026.9.8' }}"
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"
          echo "openclaw_version=${OPENCLAW_VERSION}" >> "$GITHUB_OUTPUT"
          # tag push → base 镜像用相同版本号；workflow_dispatch → base tag 默认跟随 openclaw 版本
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"   # e.g. v0.4.1
          else
            # latest 会跨 openclaw 版本复用旧 base（产出 app 与 base 版本不一致的镜像且不报错）
            if [ "${{ inputs.base_tag }}" = "latest" ]; then
              echo "::error::base_tag=latest 会跨版本复用旧 base。请留空以跟随 openclaw_version，或填与 openclaw 版本绑定的 tag。"
              exit 1
            fi
            TAG="${{ inputs.base_tag || inputs.openclaw_version || '2026.9.8' }}"
          fi
          echo "base_tag=${TAG}" >> "$GITHUB_OUTPUT"
          # tag push → 强制重建确保多架构；workflow_dispatch → base tag 已绑定 openclaw 版本，
          # 同 tag 即同版本，可安全复用
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "🔄 tag push 触发，强制重建 base（多架构）"
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
          elif docker pull "${BASE_IMAGE}:${TAG}"; then
            echo "✅ 复用已有 base: ${BASE_IMAGE}:${TAG}（tag 绑定 openclaw ${OPENCLAW_VERSION}）"
            echo "build_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "⬆️  base ${BASE_IMAGE}:${TAG} 不存在，需要多架构构建"
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push base image（multi-arch）
        if: steps.base.outputs.build_needed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.base.outputs.base_image }}:${{ steps.base.outputs.base_tag }}
          build-args: |
            OPENCLAW_VERSION=${{ steps.base.outputs.openclaw_version }}

      - name: Image metadata（tag → 镜像标签）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.base.outputs.owner }}/muad-openclaw
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build & push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.base_image }}
            BASE_TAG=${{ steps.base.outputs.base_tag }}
