name: publish-sdk

# 推送 sdk-v* tag 即构建并发布 muad-skill-http 到公网 PyPI：
#   git tag sdk-v0.1.0 && git push origin sdk-v0.1.0
# 与 build-image 的 v*、build-console 的 console-v* 互不触发。
#
# 首次发布前需在 PyPI 配置 Trusted Publisher（无需 API token）：
#   Project:    muad-skill-http
#   Owner:      <github owner> · Repository: muad-openclaw
#   Workflow:   publish-sdk.yml · Environment: pypi
# 若改用 API token，则在 Publish 步骤加：
#   password: ${{ secrets.PYPI_API_TOKEN }}
on:
  push:
    tags: ['sdk-v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/sdk-v')
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("tools/muad-skill-sdk/pyproject.toml", "rb") as handle:
              version = tomllib.load(handle)["project"]["version"]
          expected = f"sdk-v{version}"
          ref = os.environ["GITHUB_REF_NAME"]
          if ref != expected:
              raise SystemExit(f"tag {ref} != expected {expected}")
          print(f"version ok: {version}")
          PY

      - name: Test
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest requests
          python -m pytest tools/muad-skill-sdk/test

      - name: Build
        run: |
          python -m pip install build
          python -m build tools/muad-skill-sdk

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: tools/muad-skill-sdk/dist/
