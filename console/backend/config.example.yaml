# muad Console 配置模板（backend 本地开发 / K8s Secret 均可使用）。
# 复制为 config.yaml 后按需修改。config.yaml 含机密，已 gitignore、运行时挂载、不入镜像。
# 优先级：环境变量 > config.yaml > 内置兜底默认值。

# 安全与密钥
security:
  # AES-GCM 加密主密钥（派生加密 DB 内凭证的 key）。生成：openssl rand -hex 32
  masterKey: ""
  # JWT session token 签名密钥；留空默认复用 masterKey
  # jwtSecret: ""

# 初始管理员（首启幂等引导）
admin:
  user: "admin"
  password: ""

# Console 服务自身
server:
  # 监听地址；集群/宿主机通常用 0.0.0.0:8080，本地开发可用 :8080
  listenAddr: ":8080"
  # 可选日志目录；配置后同时输出 stdout 和 <logDir>/YYYY-MM-DD/console.log
  # logDir: /var/lib/muad-console/logs
  # SQLite 数据库路径（挂卷持久化）
  dbPath: /var/lib/muad-console/console.db
  # 后台采集间隔（秒）
  collectIntervalSec: 30
  # Worker 通过内部网络访问 Console internal API 的地址
  consoleInternalURL: http://muad-console:8080
  # muad-automation-platform 地址（所有 Pod 统一注入 MUAD_AUTOMATION_URL）
  # automationPlatformURL: http://muad-automation-platform:9000
  # automation-platform 鉴权 token（所有 Pod 统一注入 MUAD_AUTH_TOKEN）
  # automationPlatformToken: demo-token

# Worker 运行时
runtime:
  # "docker" 或 "k8s"
  driver: docker
  # 建 Pod/容器时默认使用的 openclaw worker 镜像
  defaultImage: ghcr.io/michaelxwb/muad-openclaw:latest
  # Console Skill 原始资产库目录。K8s 模式如未显式配置此项且配置了
  # k8s.publicSkillsMountPath，会自动使用 <publicSkillsMountPath>/.muad-skill-assets，
  # 让上传阶段直接保存到 RWX NFS；docker 模式会从该目录派生 .muad-active-public-skills 运行视图。
  # skillsDir: /var/lib/muad-console/skills
  # 注入到 worker 的运行时环境
  timezone: Asia/Shanghai
  stateDir: /home/node/.openclaw
  publicSkillsDir: /opt/openclaw-skills

# Skill 上传限制（顶层配置，env: CONSOLE_MAX_SKILL_UPLOAD_BUNDLE_SIZE）
# 上传 skill 压缩包（.tar.gz/.zip）的大小上限，单位支持 b/k/m/g（如 512k / 5m / 1g）。
# 只限制上传的压缩包本身；解压后的内容不做大小限制。
maxSkillUploadBundleSize: 5m

# Docker driver（仅 runtime.driver=docker 时生效）
docker:
  # 共享 docker 网络名（控制台与 worker 容器互通）
  network: muad-net

# Pod 资源默认值；DB 中的全局/Pod 覆写优先级高于这里
# 注意：以下 6 个键（memLimit/cpuLimit/restartPolicy/maxSkillConcurrency/
# maxBrowserConcurrency/maxLongTaskConcurrency）**唯一入口是本 resources 块**——
# 遗留的顶层 runtimeDefaults 块里同名键会被本块静默覆盖（配置了不生效），请勿混用。
resources:
  memLimit: 3g
  cpuLimit: "2"
  restartPolicy: unless-stopped
  maxSkillConcurrency: 2
  maxBrowserConcurrency: 2
  # 每 user-agent 池的长任务并发上限；env 覆盖: CONSOLE_RUNTIME_MAX_LONG_TASK_CONCURRENCY
  maxLongTaskConcurrency: 2

# Worker 运行时非资源类默认值
# 仅两个键：locale（文案语言）与 browserCDPPort*（遗留，等价 browser 块）。
# 不要在这里放资源键（见上方 resources 块注释）。
runtimeDefaults:
  # 运行时文案语言（zh / en），缺省 zh；env 覆盖: CONSOLE_RUNTIME_LOCALE
  locale: zh

# 浏览器端口分配范围
browser:
  cdpPortStart: 18802
  cdpPortEnd: 65535

# K8s driver（仅 runtime.driver=k8s 时生效）
k8s:
  namespace: muad
  # 共享 Public Skill 的 RWX PVC 名。必须同时挂载到 Console Pod 的 publicSkillsMountPath。
  # 正式环境需 NFS/CephFS/Longhorn RWX/EFS 等 RWX StorageClass。
  # skillsPVC: muad-skills
  # Console Pod 内对同一个 RWX PVC 的读写挂载路径；k8s/console.yaml 默认挂载到 /public。
  # publicSkillsMountPath: /public
  # Public Skill PVC 的 RWX StorageClass（如 nfs/cephfs/efs）
  # skillsStorageClass: ""
  skillsSize: 5Gi
  # 每个 worker state PVC 的 StorageClass；留空使用集群默认
  # storageClass: ""
  stateSize: 5Gi
  # worker Pod 节点选择；例如首次只允许调度到 app=openclaw 的节点。
  # 后续是否固定到首次节点取决于 state PVC/PV 是否具备节点亲和性。
  # workerNodeSelector:
  #   app: openclaw
